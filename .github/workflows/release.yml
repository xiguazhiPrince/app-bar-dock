name: Release

# Push to main -> build + downloadable workflow artifacts (no Release, so
# repeated pushes never collide on a version number).
# Push a v* tag -> same build, then attach the artifacts to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Must stay on the same major as "packageManager" in package.json.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Artifact names and the in-app version should match the release tag, so
      # the tag is the single source of truth for a release build.
      - name: Align version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pkg set version="$version"
          echo "building version $version"

      - name: Build
        run: pnpm make

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find out/make -type f \
            \( -name '*.exe' -o -name '*.nupkg' -o -name '*.zip' -o -name 'RELEASES' \) \
            -exec cp {} dist/ \;
          ls -la dist
          if ! ls dist/*.exe >/dev/null 2>&1; then
            echo "::error::no Windows installer (.exe) was produced"
            exit 1
          fi
          if ! ls dist/*.zip >/dev/null 2>&1; then
            echo "::error::no portable .zip was produced"
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appbardock-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
