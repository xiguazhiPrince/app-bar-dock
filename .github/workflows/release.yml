name: Release

# Push to main -> build + downloadable workflow artifacts (no Release, so
# repeated pushes never collide on a version number).
# Push a v* tag -> same build, then attach the artifacts to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version` input on purpose: the action reads "packageManager" from
      # package.json, and passing both is a hard error (multiple versions).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm does not run dependency install scripts unless they are allow-listed
      # (see "pnpm.onlyBuiltDependencies" in package.json). electron-winstaller
      # unpacks its vendor Squirrel/7z binaries in exactly such a script; if it
      # is skipped, `make` later dies with a cryptic "cannot find the file
      # specified". Catch it here, and self-heal by forcing the script.
      - name: Verify Squirrel vendor binaries
        shell: bash
        run: |
          vendor="node_modules/electron-winstaller/vendor/7z.exe"
          if [ ! -f "$vendor" ]; then
            echo "::warning::7z.exe missing, re-running electron-winstaller install script"
            pnpm rebuild electron-winstaller
          fi
          ls -la node_modules/electron-winstaller/vendor || true
          if [ ! -f "$vendor" ]; then
            echo "::error::electron-winstaller vendor binaries are missing (7z.exe)"
            exit 1
          fi

      # Artifact names and the in-app version should match the release tag, so
      # the tag is the single source of truth for a release build.
      - name: Align version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pkg set version="$version"
          echo "building version $version"

      # Tee the build output so a failure can be surfaced as a check-run
      # annotation - workflow logs need repository admin rights to download,
      # annotations are readable from the public API.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          DEBUG=electron-forge:* pnpm make 2>&1 | tee make.log

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          echo "### Build log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 make.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          body=$(tail -n 40 make.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error::${body}"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Ship only what end users download: the Squirrel installer and the
          # portable zip. Squirrel's Setup.exe already embeds the full .nupkg,
          # nothing in the app does Squirrel auto-update, so the standalone
          # .nupkg plus the RELEASES manifest would only duplicate ~140 MB in
          # every artifact and release.
          find out/make -type f \( -name '*.exe' -o -name '*.zip' \) \
            -exec cp {} dist/ \;
          ls -la dist
          if ! ls dist/*.exe >/dev/null 2>&1; then
            echo "::error::no Windows installer (.exe) was produced"
            exit 1
          fi
          if ! ls dist/*.zip >/dev/null 2>&1; then
            echo "::error::no portable .zip was produced"
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appbardock-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
